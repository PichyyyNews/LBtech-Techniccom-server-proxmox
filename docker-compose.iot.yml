version: '3.8'

services:
  # 1. EMQX Broker v5 (Core MQTT & WebSocket Engine)
  emqx:
    image: emqx/emqx:5.8.0
    container_name: iot-emqx
    restart: always
    environment:
      - "EMQX_NODE__NAME=emqx@127.0.0.1"
      - "EMQX_DASHBOARD__DEFAULT_USERNAME=tc-iotadmin"
      - "EMQX_DASHBOARD__DEFAULT_PASSWORD=Techniccom.IoT2026"
    ports:
      - "8083:8083"    # MQTT over WebSocket (ชี้จาก Cloudflare Tunnel เข้าพอร์ตนี้)
      - "18083:18083"  # EMQX Admin Console
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log

  # 2. InfluxDB v2 (TimeSeries Storage สำหรับจัดเก็บประวัติเซนเซอร์ย้อนหลัง)
  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=iotadmin
      - DOCKER_INFLUXDB_INIT_PASSWORD=Techniccom.Influx2026
      - DOCKER_INFLUXDB_INIT_ORG=lbtech
      - DOCKER_INFLUXDB_INIT_BUCKET=iot-telemetry
      - DOCKER_INFLUXDB_INIT_RETENTION=30d # ลบข้อมูลเก่าอัตโนมัติ 30 วัน
    volumes:
      - influxdb-data:/var/lib/influxdb2

  # 3. PostgreSQL Database (Enterprise Relational Storage สำหรับบัญชีผู้ใช้, เครื่องเซิร์ฟเวอร์ และ Audit Logs)
  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    restart: always
    environment:
      - POSTGRES_DB=lbtech_iot
      - POSTGRES_USER=iotuser
      - POSTGRES_PASSWORD=Techniccom.Postgres2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # 4. Centralized Backend API (Proxmox Provisioning + InfluxDB/EMQX Auto-Provisioning + Database)
  backend:
    build:
      context: ./iot-backend
      dockerfile: Dockerfile
    container_name: iot-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - POSTGRES_URL=postgresql://iotuser:Techniccom.Postgres2026!@postgres:5432/lbtech_iot
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lbtech_iot
      - POSTGRES_USER=iotuser
      - POSTGRES_PASSWORD=Techniccom.Postgres2026!
      - PVE_HOST=10.10.10.1
      - PVE_PORT=8006
      - PVE_USER=tc-admin@pam
      - PVE_PASSWORD=07072569
      - PVE_NODE=techniccom
      - PVE_STORAGE=pve-extra
      - PVE_BRIDGE=vmbr1
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_ADMIN_USER=iotadmin
      - INFLUX_ADMIN_PASS=Techniccom.Influx2026
      - INFLUX_ORG=lbtech
      - INFLUX_TOKEN=3oSD6wIOp8AiuGi8RIByohv-GufR7fIAaT5aHVB0eQOy2eyGOVucgdt35zx_ZS4FOdKbYsGBdtzTpYQl0L29CA==
      - EMQX_URL=http://emqx:18083
      - EMQX_USER=tc-iotadmin
      - EMQX_PASS=Techniccom.IoT2026
      - DATA_DIR=/app/data
      - ADMIN_PIN=2569
    volumes:
      - backend-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/iot-workspaces:/opt/iot-workspaces
    depends_on:
      - emqx
      - influxdb
      - postgres

  # 5. Student IoT Portal (UI สมัครสมาชิก, ขอเครื่อง CT, แผงควบคุมอาจารย์ & ดูรหัสผ่าน)
  portal:
    build:
      context: ./iot-portal
      dockerfile: Dockerfile
    container_name: iot-portal
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - emqx

volumes:
  emqx-data:
  emqx-log:
  influxdb-data:
  postgres-data:
  backend-data:
